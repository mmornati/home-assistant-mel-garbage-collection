name: Release Validation

'on':
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    name: Run Lint and Tests on Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements-dev.txt"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

