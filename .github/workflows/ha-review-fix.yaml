---
# Opens a pull request for the findings of an HA release review issue, once a
# maintainer approves it by adding the `ha-review:fix` label.
#
# The label is the decision: only someone with write access can trigger this,
# and the result is always a PR for human review, never a merge.
#
# Security: the review issue was generated from third-party text, so the job
# that runs Claude (scripts/ci/ha_fix.py) has `contents: read` only and tools
# confined to custom_components/mel_collecte and tests, plus pytest and the
# import smoke test. It produces a patch; a separate job without an LLM checks
# the touched paths and opens the PR.
#
# The unit tests stub the whole `homeassistant` package (tests/conftest.py), so
# the check against the real Home Assistant is scripts/ci/import_smoke.py, run
# on the reviewed HA version and reported in the PR next to the tests.
#
# Requires the ANTHROPIC_API_KEY repository secret. The model follows the
# HA_REVIEW_MODEL repository variable, like the review workflow.
name: HA Review Fix (Claude)

'on':
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Number of the HA release review issue to fix'
        required: true
        type: string
      model:
        description: 'Claude model for this run (e.g. claude-sonnet-5-5). Empty = HA_REVIEW_MODEL.'
        type: string
        default: ''

permissions:
  contents: read

env:
  HA_REVIEW_MODEL: ${{ inputs.model || vars.HA_REVIEW_MODEL || 'claude-opus-5-5' }}

concurrency:
  group: ha-review-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check approval
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ha-review:fix' &&
       contains(github.event.issue.labels.*.name, 'ha-release-review'))
    permissions:
      issues: read
    outputs:
      issue: ${{ steps.check.outputs.issue }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - name: Check issue and who approved it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SENDER: ${{ github.event.sender.login || github.actor }}
        run: |
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number '$ISSUE'"; exit 1
          fi
          if ! gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx ha-release-review; then
            echo "::error::#$ISSUE is not an HA release review issue"; exit 1
          fi
          # Only issues opened by the review workflow itself, not look-alikes.
          AUTHOR=$(gh api "repos/$GH_REPO/issues/$ISSUE" --jq .user.login)
          if [ "$AUTHOR" != "github-actions[bot]" ]; then
            echo "::error::#$ISSUE was opened by $AUTHOR, not by the review workflow"; exit 1
          fi
          PERMISSION=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) echo "Approved by $SENDER ($PERMISSION)" ;;
            *) echo "::error::$SENDER has '$PERMISSION' access; write access is required"; exit 1 ;;
          esac
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

          # Pin what was approved: for a label event, the issue as it was when
          # the label was added (from the event payload), not a later edit.
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            jq '{number: .issue.number, title: .issue.title, body: .issue.body}' "$GITHUB_EVENT_PATH" > issue.json
          else
            gh issue view "$ISSUE" --json number,title,body > issue.json
          fi
          sha256sum issue.json

          # The HA version the review was about, from the issue footer
          # ("Automated review of HA 2026.11.0b1 by Claude ...").
          TARGET=$(jq -r .body issue.json | grep -oE 'review of HA 20[0-9]{2}\.[0-9]+\.[0-9]+(b[0-9]+)?' \
            | head -1 | sed 's/^review of HA //' || true)
          echo "Reviewed HA version: ${TARGET:-unknown}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload approved issue
        uses: actions/upload-artifact@v7
        with:
          name: ha-fix-issue
          path: issue.json
          retention-days: 7

  fix:
    name: Claude fix - issue ${{ needs.gate.outputs.issue }}
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
      has_patch: ${{ steps.patch.outputs.has_patch }}
      tests: ${{ steps.verify.outputs.tests }}
      smoke: ${{ steps.smoke.outputs.smoke }}
      ha_version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve latest Home Assistant
        id: ha
        run: python3 scripts/ci/ha_versions.py --months 1

      # No test harness pins the HA version here (the unit tests use stubs), so
      # install the version the review was about, often a beta: Claude reads its
      # source and the import smoke test runs on it. Latest stable otherwise.
      - name: Pick Home Assistant version
        id: pick
        env:
          TARGET: ${{ needs.gate.outputs.target }}
          LATEST: ${{ steps.ha.outputs.latest }}
          LATEST_PY: ${{ steps.ha.outputs.latest_python }}
        run: |
          PY=""
          if [ -n "$TARGET" ]; then
            PY=$(python3 scripts/ci/ha_versions.py --python-for "$TARGET" 2>/dev/null || true)
          fi
          if [ -n "$PY" ]; then
            VERSION="$TARGET"
          else
            echo "::warning::Reviewed HA version unknown or unavailable; using ${LATEST}"
            VERSION="$LATEST"; PY="$LATEST_PY"
          fi
          echo "Home Assistant $VERSION on Python $PY"
          {
            echo "version=$VERSION"
            echo "python=$PY"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ steps.pick.outputs.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pick.outputs.python }}

      - name: Install Home Assistant ${{ steps.pick.outputs.version }}
        id: install
        env:
          # From the issue body (regex-checked by the gate): through env only.
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          scripts/ci/install_ha.sh "$VERSION" tests
          python -c 'import homeassistant, os; print("ha_src=" + os.path.dirname(homeassistant.__file__))' \
            >> "$GITHUB_OUTPUT"

      - name: Download approved issue
        uses: actions/download-artifact@v8
        with:
          name: ha-fix-issue
          path: ${{ runner.temp }}

      # Separate venv for the SDK and the formatters; pytest and the import smoke
      # test run in the Home Assistant env above. black and ruff are unpinned,
      # like requirements-dev.txt that the Validate workflow lints with.
      - name: Claude fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HA_SRC: ${{ steps.install.outputs.ha_src }}
          HA_VERSION: ${{ steps.pick.outputs.version }}
        run: |
          if ! [[ "$HA_REVIEW_MODEL" =~ ^claude-[a-z0-9.-]+$ ]]; then
            echo "::error::Invalid model id '$HA_REVIEW_MODEL'"; exit 1
          fi
          PYTEST_PYTHON=$(command -v python)
          python -m venv "$RUNNER_TEMP/fix-venv"
          "$RUNNER_TEMP/fix-venv/bin/pip" install --quiet "anthropic>=2.3,<3" black ruff
          "$RUNNER_TEMP/fix-venv/bin/python" scripts/ci/ha_fix.py \
            --issue "$RUNNER_TEMP/issue.json" --ha-src "$HA_SRC" --pytest-python "$PYTEST_PYTHON" \
            --ha-version "$HA_VERSION" --summary-out "$RUNNER_TEMP/ha-fix-summary.md"

      - name: Read result
        id: result
        run: |
          RESULT=$(head -1 "$RUNNER_TEMP/ha-fix-summary.md" | sed 's/^Result: //')
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      # Same tools as `make lint` (ruff with ruff.toml, black); no isort here.
      # ruff only applies its safe fixes; anything left fails the PR's own CI.
      - name: Format changed code
        run: |
          "$RUNNER_TEMP/fix-venv/bin/ruff" check --fix --quiet custom_components/mel_collecte tests || true
          "$RUNNER_TEMP/fix-venv/bin/black" --quiet custom_components/mel_collecte tests

      # Re-run the tests here rather than trusting Claude's own run. The tests
      # include code Claude wrote: run them with a minimal environment so they
      # cannot reach tokens or write $GITHUB_OUTPUT / $GITHUB_ENV, and take the
      # result only from the exit code.
      - name: Verify tests
        id: verify
        run: |
          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            python -m pytest tests/ -q --tb=short -p no:cacheprovider > "$RUNNER_TEMP/pytest.log" 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "tests=passed" >> "$GITHUB_OUTPUT"
          else
            echo "tests=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Tests fail with Claude's changes; the PR will say so"
          fi
          tail -3 "$RUNNER_TEMP/pytest.log"
          # Only a line that looks like pytest's own summary goes into the PR.
          LAST=$(tail -1 "$RUNNER_TEMP/pytest.log" | tr -d '=' | sed 's/^ *//;s/ *$//')
          if [[ "$LAST" =~ ^[0-9]+\ (passed|failed|error)(,\ [0-9]+\ [a-z]+)*\ in\ [0-9.]+s$ ]]; then
            echo "$LAST" > "$RUNNER_TEMP/pytest-summary.txt"
          else
            echo "see the workflow log" > "$RUNNER_TEMP/pytest-summary.txt"
          fi

      # The tests above run against stubs; this is the check on the real HA.
      # Same minimal environment: it imports code Claude wrote.
      - name: Verify import smoke test
        id: smoke
        run: |
          set +e
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
            python scripts/ci/import_smoke.py > "$RUNNER_TEMP/import-smoke.log" 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "smoke=passed" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::The integration does not import on Home Assistant with Claude's changes; the PR will say so"
          fi
          cat "$RUNNER_TEMP/import-smoke.log"

      - name: Build patch
        id: patch
        run: |
          git add -A
          scripts/ci/check_patch_paths.sh
          git diff --cached --binary > "$RUNNER_TEMP/ha-fix.patch"
          if [ -s "$RUNNER_TEMP/ha-fix.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          fi
          cp "$RUNNER_TEMP/ha-fix.patch" "$RUNNER_TEMP/ha-fix-summary.md" "$RUNNER_TEMP/pytest-summary.txt" .

      - name: Upload fix
        uses: actions/upload-artifact@v7
        with:
          name: ha-fix
          retention-days: 7
          path: |
            ha-fix.patch
            ha-fix-summary.md
            pytest-summary.txt

  pr:
    name: Open pull request
    runs-on: ubuntu-latest
    needs: [gate, fix]
    if: needs.fix.outputs.has_patch == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download fix
        uses: actions/download-artifact@v8
        with:
          name: ha-fix
          path: ${{ runner.temp }}/ha-fix

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          RESULT: ${{ needs.fix.outputs.result }}
          TESTS: ${{ needs.fix.outputs.tests }}
          SMOKE: ${{ needs.fix.outputs.smoke }}
          HA_VERSION: ${{ needs.fix.outputs.ha_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIX_DIR: ${{ runner.temp }}/ha-fix
        run: |
          git apply --index "$FIX_DIR/ha-fix.patch"
          # Same path check as the fix job, in case the artifact was altered.
          scripts/ci/check_patch_paths.sh

          scripts/ci/sanitize_report.sh "$FIX_DIR/ha-fix-summary.md"
          BRANCH="claude/ha-fix-${ISSUE}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "fix: address HA release review #${ISSUE}" \
              -m "Generated by Claude (${HA_REVIEW_MODEL}) from the findings in #${ISSUE}."
          git push -q origin "$BRANCH"

          {
            cat "$FIX_DIR/ha-fix-summary.md"
            echo ""
            echo "## Checks"
            echo "- Import smoke test on Home Assistant ${HA_VERSION}, re-run by the workflow: **${SMOKE}**"
            echo "- Unit tests re-run by the workflow after formatting: **${TESTS}** ($(cat "$FIX_DIR/pytest-summary.txt")); they use the stubs in tests/conftest.py, not the real Home Assistant"
            echo "- Opened by the workflow token, so CI does not start on its own: close and reopen the PR to run it."
            echo ""
            echo "---"
            echo "_Generated by Claude (${HA_REVIEW_MODEL}) for #${ISSUE} · [workflow run](${RUN_URL})._"
            echo "_Review every change: the findings came from an automated review of third-party text._"
          } > body.md
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "fix: address HA release review #${ISSUE} (${RESULT})" --body-file body.md)
          gh issue comment "$ISSUE" --body "Claude opened ${PR_URL} (result: ${RESULT}, import smoke: ${SMOKE}, tests: ${TESTS})."
          gh issue edit "$ISSUE" --remove-label ha-review:fix || true

  report:
    name: Report without changes
    runs-on: ubuntu-latest
    needs: [gate, fix]
    if: always() && needs.gate.result == 'success' && needs.fix.outputs.has_patch != 'true'
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download fix
        if: needs.fix.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ha-fix
          path: ${{ runner.temp }}/ha-fix

      - name: Comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          FIX_RESULT: ${{ needs.fix.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY: ${{ runner.temp }}/ha-fix/ha-fix-summary.md
        run: |
          if [ "$FIX_RESULT" = "success" ]; then
            scripts/ci/sanitize_report.sh "$SUMMARY"
            case "$(head -1 "$SUMMARY")" in
              "Result: NEEDS_HUMAN") HEADLINE="Claude made no changes: some findings need a maintainer's decision." ;;
              *) HEADLINE="Claude found nothing to change for this review." ;;
            esac
            {
              echo "$HEADLINE"
              echo ""
              cat "$SUMMARY"
              echo ""
              echo "_[workflow run](${RUN_URL})_"
            } > body.md
          else
            echo "The fix workflow failed before producing a result: see the [workflow run](${RUN_URL})." > body.md
          fi
          gh issue comment "$ISSUE" --body-file body.md
          gh issue edit "$ISSUE" --remove-label ha-review:fix 2>/dev/null || true
