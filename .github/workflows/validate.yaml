name: Validate

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  manifest_requirements:
    name: Validate Manifest Requirements
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Validate manifest requirements match imports
        run: |
          python3 -c "
          import json
          import re
          from pathlib import Path

          # Load manifest
          manifest = json.loads(Path('custom_components/mel_collecte/manifest.json').read_text())
          requirements = set(manifest.get('requirements', []))

          # Normalize requirement names (pip uses hyphens, imports use underscores)
          # async-timeout -> async_timeout
          normalized_reqs = set()
          for req in requirements:
              normalized_reqs.add(req.replace('-', '_').split('>')[0].split('<')[0].split('=')[0].strip())

          # Extract imports from Python files
          imports = set()
          for py_file in Path('custom_components/mel_collecte').rglob('*.py'):
              content = py_file.read_text()
              # Find import statements
              for match in re.findall(r'^(?:from|import)\s+([^\s;]+)', content, re.MULTILINE):
                  module = match.split('.')[0]
                  if module not in ('MelCollecte', 'mel_collecte'):
                      imports.add(module)

          # Check for external packages used directly (aiohttp, async_timeout, etc.)
          external_modules = {'aiohttp', 'async_timeout', 'aiohttp_client'}
          used_external = imports & external_modules

          missing = used_external - normalized_reqs
          if missing:
              print(f'ERROR: Manifest missing requirements: {missing}')
              print(f'Normalized manifest requirements: {normalized_reqs}')
              print(f'Used external modules: {used_external}')
              exit(1)
          print('Manifest requirements validation passed')
          "

  validate:
    name: Validate with Hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs_validation:
    name: HACS Validation
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: HACS validation
        uses: hacs/action@main
        with:
          ignore: brands
          category: integration

  style:
    name: Lint & Type Check
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Python
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Run project lint target
        run: make lint

  security:
    name: Security Scan
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Python
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install bandit safety
          python3 -m pip install -r requirements-dev.txt

      - name: Run Bandit security scan
        run: bandit -r custom_components/mel_collecte
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: safety check --json || true
        continue-on-error: true

  tests:
    name: Run Unit Tests
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v5"

      - name: Setup Python
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest
